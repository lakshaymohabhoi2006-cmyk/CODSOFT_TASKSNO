name: Deploy quizletto demo

on:
  push:
    branches: [main]
    paths:
      - 'online-quiz-maker/**'
      - '.github/workflows/deploy-quizletto.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: online-quiz-maker/package-lock.json

      - name: Install dependencies
        working-directory: online-quiz-maker
        run: npm ci

      - name: Build the public demo
        working-directory: online-quiz-maker
        run: npm run build
        env:
          VITE_DEMO_MODE: 'true'
          VITE_BASE_PATH: /CODSOFT_TASKSNO/

      - name: Upload the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: online-quiz-maker/client/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
